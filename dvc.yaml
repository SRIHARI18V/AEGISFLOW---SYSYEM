stages:
  features_pit:
    cmd: PYTHONPATH=ml/src python -m aegis_ml.features.offline --out data/features/features_pit.parquet
    deps:
      - ml/src/aegis_ml/features
    outs:
      - data/features/features_pit.parquet
    always_changed: true

  prepare_ieee:
    cmd: PYTHONPATH=ml/src python -m aegis_ml.training.prepare_ieee --raw data/raw/ieee --out data/processed
    deps: [data/raw/ieee, ml/src/aegis_ml/training/prepare_ieee.py]
    outs: [data/processed/ieee_transactions.parquet, data/processed/ieee_meta.json]

  train_fraud:
    cmd: PYTHONPATH=ml/src python -m aegis_ml.training.train_fraud
    deps:
      - data/processed/ieee_transactions.parquet
      - ml/src/aegis_ml/features/definitions.py
      - ml/src/aegis_ml/training/matrix.py
      - ml/src/aegis_ml/training/splits.py
      - ml/src/aegis_ml/models/fraud_models.py
      - ml/src/aegis_ml/models/calibration.py
      - ml/src/aegis_ml/training/train_fraud.py
    params: [fraud]
    outs: [artifacts/fraud]
    metrics:
      - reports/m3_fraud.json:
          cache: false
